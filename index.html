<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2 Aim Tuner</title>
<style>
*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d13;color:#eef5ff;font-family:Inter,Arial,sans-serif}
#game{position:fixed;inset:0;background:radial-gradient(circle at 50% 48%,#172232 0,#0b111a 52%,#070a0f 100%);cursor:crosshair}
#bar{position:fixed;z-index:20;top:0;left:0;right:0;height:58px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#0b1119eF;border-bottom:1px solid #263448}
.logo{font-weight:900;letter-spacing:.5px}.logo b{color:#55d7ff}.hud{font-size:13px;color:#9fb0c5}
.card{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,92vw);padding:30px;border:1px solid #2b3b50;border-radius:18px;background:#121b27;box-shadow:0 30px 100px #0009}
h1{margin:0 0 10px;font-size:30px}.sub{color:#9aabc0;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:24px 0}
label{font-size:13px;color:#93a5bb}input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #34475f;border-radius:9px;background:#09111b;color:white;font-size:17px}
button{border:0;border-radius:10px;padding:14px 22px;background:#58d8ff;color:#041019;font-weight:900;font-size:16px;cursor:pointer}button:hover{filter:brightness(1.08)}
.note{margin-top:16px;color:#8194aa;font-size:13px;line-height:1.5}
#target{position:fixed;z-index:8;width:42px;height:42px;border-radius:50%;background:#ff5968;border:5px solid #ffffff2b;transform:translate(-50%,-50%);display:none}
#target:after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:white;transform:translate(-50%,-50%)}
#cross{position:fixed;z-index:9;width:24px;height:24px;display:none;pointer-events:none;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}#cross:before{width:2px;height:24px;left:11px}#cross:after{width:24px;height:2px;top:11px}
#toast{position:fixed;z-index:40;bottom:28px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:#111b29eF;color:#b4c3d5;display:none}
#results{display:none}.best{font-size:36px;font-weight:900;color:#79e5a0;margin:14px 0}.box{padding:17px;border:1px solid #293a50;border-radius:12px;background:#09121d;line-height:1.8;color:#c8d5e4}
.small{font-size:12px;color:#7f92a8}
</style>
</head>
<body>
<div id="game"></div>
<div id="bar"><div class="logo">CS2 <b>AIM TUNER</b></div><div id="hud" class="hud">READY</div></div>
<div id="target"></div><div id="cross"></div><div id="toast"></div>
<div id="card" class="card">
  <div id="setup">
    <h1>CS2 AWP：Zoom Sens 校准</h1>
    <div class="sub">固定 1600 DPI + CS2 Sens 0.60，只盲测 AWP Zoom Sens。模拟开镜后的左右甩枪、斜向 Flick 与小幅修正。</div>
    <div class="grid">
      <label>Mouse DPI<input id="dpi" type="number" value="1600"></label>
      <label>固定 CS2 Sensitivity<input id="sens" type="number" value="0.60" step="0.01" readonly></label>
    </div>
    <button id="start">开始校准</button>
    <div class="note">建议全屏使用。点击开始后网页会请求锁定鼠标；按 ESC 可退出。每一枪都会记录结果，不要求必须命中才进入下一靶。</div>
  </div>
  <div id="results">
    <h1>测试完成</h1>
    <div id="best" class="best"></div>
    <div id="detail" class="box"></div><br>
    <button onclick="location.reload()">重新测试</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const game=$("game"), target=$("target"), cross=$("cross"), card=$("card"), setup=$("setup"), resultPanel=$("results"), hud=$("hud"), toast=$("toast");
let running=false,dpi=1600,base=1.10,candidates=[],plan=[],results=[],trial=0,vx=innerWidth/2,vy=innerHeight/2,tx=0,ty=0,startTime=0,path=[],radius=21,firstEntry=0,insideLast=false,entries=0;
const perSens=14;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const median=a=>{if(!a.length)return 0;let s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
 candidates=[0.80,0.85,0.90,0.95,1.00,1.05,1.10].map(x=>+x.toFixed(3));
 let templates=[];
 for(let i=0;i<perSens;i++){
   let angle=Math.random()*Math.PI*2;
   let band=i%3;
   let minDim=Math.min(innerWidth,innerHeight);
   let distance;
   if(band===0) distance=minDim*(.075+Math.random()*.055);      // micro
   else if(band===1) distance=minDim*(.15+Math.random()*.075); // standard
   else distance=minDim*(.25+Math.random()*.085);              // large flick
   templates.push({angle,distance,band});
 }
 plan=[]; candidates.forEach(s=>templates.forEach(t=>plan.push({s,t}))); shuffle(plan);
}
$("start").onclick=async()=>{
 dpi=+$("dpi").value||800;base=+$("sens").value||1.35;build();
 try{
   const p=game.requestPointerLock({unadjustedMovement:true});
   if(p&&p.catch) await p.catch(()=>game.requestPointerLock());
 }catch(e){
   try{await game.requestPointerLock()}catch(err){alert("鼠标锁定失败。请确认你打开的是 GitHub Pages 的 https:// 网页，而不是 GitHub 文件预览页。");}
 }
};
document.addEventListener("pointerlockchange",()=>{
 if(document.pointerLockElement===game){toast.style.display="none";if(!running)begin()}
 else if(running){toast.style.display="block";toast.textContent="已退出鼠标锁定。点击背景继续。"}
});
game.onclick=()=>{if(running&&document.pointerLockElement!==game)game.requestPointerLock()};
function begin(){running=true;trial=0;results=[];card.style.display="none";target.style.display=cross.style.display="block";next()}
function next(){
 if(trial>=plan.length)return finish();
 vx=innerWidth/2;vy=innerHeight/2;cross.style.left=vx+"px";cross.style.top=vy+"px";
 let q=plan[trial],a=q.t.angle,d=q.t.distance;
 tx=clamp(vx+Math.cos(a)*d,65,innerWidth-65);ty=clamp(vy+Math.sin(a)*d,100,innerHeight-65);
 target.style.left=tx+"px";target.style.top=ty+"px";path=[];firstEntry=0;insideLast=false;entries=0;startTime=performance.now();hud.textContent=`AWP ZOOM • BLIND • ${trial+1}/${plan.length}`;
}
document.addEventListener("mousemove",e=>{
 if(!running||document.pointerLockElement!==game)return;
 let q=plan[trial];if(!q)return;let gain=q.s;
 vx=clamp(vx+e.movementX*gain,4,innerWidth-4);vy=clamp(vy+e.movementY*gain,62,innerHeight-4);
 cross.style.left=vx+"px";cross.style.top=vy+"px";
 let now=performance.now(), dist=Math.hypot(vx-tx,vy-ty), inside=dist<=radius;
 if(inside&&!insideLast){entries++;if(!firstEntry)firstEntry=now-startTime}
 insideLast=inside;
 path.push({x:vx,y:vy,t:now,dist});
});
document.addEventListener("mousedown",e=>{
 if(!running||e.button!==0||document.pointerLockElement!==game)return;
 let q=plan[trial];if(!q)return;
 let dx=vx-tx,dy=vy-ty,err=Math.hypot(dx,dy),hit=err<=radius,elapsed=performance.now()-startTime;
 let sx=innerWidth/2,sy=innerHeight/2,ideal=Math.hypot(tx-sx,ty-sy),pd=0,prev={x:sx,y:sy};
 path.forEach(p=>{pd+=Math.hypot(p.x-prev.x,p.y-prev.y);prev=p});
 let eff=ideal/Math.max(ideal,pd),ux=(tx-sx)/ideal,uy=(ty-sy)/ideal,maxProj=0;
 path.forEach(p=>maxProj=Math.max(maxProj,(p.x-sx)*ux+(p.y-sy)*uy));
 let over=Math.max(0,maxProj-ideal)/radius;
 results.push({s:q.s,hit,time:elapsed,first:firstEntry||elapsed,error:err/radius,eff,over,entries});trial++;next();
});
function finish(){
 running=false;if(document.pointerLockElement)document.exitPointerLock();target.style.display=cross.style.display="none";hud.textContent="RESULTS";
 let summary=candidates.map(s=>{
   let d=results.filter(r=>r.s===s),hit=d.filter(r=>r.hit),hr=hit.length/d.length,mt=median(hit.map(r=>r.time)),mf=median(d.map(r=>r.first)),eff=median(d.map(r=>r.eff)),ov=median(d.map(r=>r.over)),er=median(d.map(r=>r.error)),ent=median(d.map(r=>r.entries));
   let acquire=clamp(1-(mf-250)/650,0,1);
   let finalSpeed=hit.length?clamp(1-(mt-450)/900,0,1):0;
   let correction=clamp(1-Math.max(0,ent-1)/3,0,1);
   let score=hr*.24+acquire*.25+finalSpeed*.12+eff*.17+clamp(1-Math.min(1,ov),0,1)*.14+correction*.05+clamp(1-Math.min(1,er),0,1)*.03;
   return{s,hr,mt,mf,eff,ov,er,ent,score};
 }).sort((a,b)=>b.score-a.score);
 let b=summary[0],edpi=Math.round(dpi*b.s),cm=2.54*360/(dpi*b.s*.022),second=summary[1],gap=b.score-second.score;
 let low=Math.max(.1,b.s*(gap<.035?.97:.985)),high=b.s*(gap<.035?1.03:1.015);
 let zoom=b.ov>.22?.95:(b.er>.65?1.03:1);
 $("best").textContent=`${b.s.toFixed(3)} zoom sensitivity`;
 $("detail").innerHTML=`<b>DPI：</b>${dpi}<br><b>固定基础 Sens：</b>${base.toFixed(2)}<br><b>推荐 Zoom Sens：</b>${b.s.toFixed(2)}<br><b>建议精调范围：</b>${low.toFixed(3)} – ${high.toFixed(3)}<br><br><b>最佳档命中率：</b>${(b.hr*100).toFixed(0)}%<br><b>第一次进入目标中位时间：</b>${b.mf.toFixed(0)} ms<br><b>最终点击中位时间：</b>${b.mt?b.mt.toFixed(0):"—"} ms<br><b>轨迹效率：</b>${(b.eff*100).toFixed(0)}%<br><b>Overshoot：</b>${b.ov.toFixed(2)}R<br><b>进入目标区次数：</b>${b.ent.toFixed(1)}<br><br><span class="small">AWP Zoom 建议完成两轮。两轮结果接近后，把推荐值写入 CS2 的 Zoom Sensitivity Multiplier，再进游戏用 AWP 实战验证。</span>`;
 setup.style.display="none";resultPanel.style.display="block";card.style.display="block";
 window.aimTunerResults={dpi,base,recommendation:b.s,edpi,cm360:cm,zoom,summary,trials:results};
}
</script>
</body>
</html>
